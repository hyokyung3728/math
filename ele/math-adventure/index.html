<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 모험 · 1학년 2학기</title>
<meta name="theme-color" content="#EAF5FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수학 모험">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="s-map" class="screen">
    <header class="top">
      <div><div class="hello" id="m-hello">안녕!</div><h1 id="m-title">1학년 2학기 섬</h1></div>
      <div class="topr">
        <div class="seg" id="m-books" role="group" aria-label="학기 고르기"></div>
        <div class="pill" aria-label="모은 별"><span id="m-stars-ic"></span><b id="m-stars">0</b></div>
      </div>
    </header>
    <div id="mapwrap"><svg id="mappath" aria-hidden="true"><path d=""/></svg><div id="islands"></div></div>
  </section>

  <section id="s-unit" class="screen" hidden>
    <header class="sub">
      <button class="rb" id="u-back" aria-label="지도로 돌아가기"></button>
      <div><div class="muted" id="u-sub"></div><h2 id="u-title"></h2></div>
    </header>
    <div class="scroll">
      <div class="card prog"><div class="row"><span id="u-line">건넌 징검다리</span><b id="u-prog"></b></div><div class="bar"><i id="u-bar"></i></div></div>
      <div id="u-list"></div>
      <div class="tip"><span id="u-mas"></span><p id="u-tip"></p></div>
    </div>
  </section>

  <section id="s-play" class="screen" hidden>
    <header class="ph">
      <button class="rb" id="p-close" aria-label="그만하기"></button>
      <div class="bar"><i id="p-bar"></i></div>
      <b id="p-count">1 / 8</b>
    </header>
    <div class="pm" id="p-main">
      <div class="pleft">
        <div class="say">
          <div class="mas" id="p-mascot"></div>
          <div class="bubble"><span id="p-prompt"></span><button class="rb sm" id="p-say" aria-label="문제 읽어 주기"></button></div>
        </div>
        <div class="qcard" id="p-card">
          <div id="p-visual"></div>
          <div class="stp" id="p-step"></div>
          <div id="p-ans"></div>
          <div class="hint" id="p-hint"></div>
          <div class="choices" id="p-choices"></div>
          <button class="big" id="p-next" hidden>다음</button>
        </div>
      </div>
      <div class="keys" id="p-keys" hidden>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="back" class="kx" aria-label="지우기">지우기</button><button data-k="0">0</button><button data-k="ok" class="kx okk">확인</button>
      </div>
    </div>
    <div id="p-flash" aria-hidden="true"></div>
  </section>

  <section id="s-result" class="screen" hidden>
    <div class="scroll"><div id="r-body" class="rbody"></div></div>
  </section>

  <section id="s-friends" class="screen" hidden>
    <header class="sub">
      <div><h2>내 친구</h2><div class="muted">별을 모으면 새싹이가 자라요</div></div>
      <div class="pill" aria-label="모은 별"><span id="f-stars-ic"></span><b id="f-stars">0</b></div>
    </header>
    <div class="scroll" id="f-body"></div>
  </section>

  <section id="s-parent" class="screen" hidden>
    <header class="sub">
      <div><h2>엄마 화면</h2><div class="muted" id="pa-sub">보호자 확인이 필요해요</div></div>
    </header>
    <div class="scroll" id="pa-body"></div>
  </section>

  <nav id="nav" aria-label="메뉴">
    <button data-go="map" aria-current="page">지도</button>
    <button data-go="friends">내 친구</button>
    <button data-go="parent">엄마 화면</button>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/data.js"></script>
<script src="js/book-g1s2.js"></script>
<script src="js/book-g2s1.js"></script>
<script src="js/book-g2s2.js"></script>
<script src="js/visuals.js"></script>
<script src="js/visuals-g2.js"></script>
<script src="js/visuals-g3.js"></script>
<script src="js/generators.js"></script>
<script src="js/gen-g2s1.js"></script>
<script src="js/gen-g2s2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
