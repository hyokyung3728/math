/* ---- QRMath.js ---- */
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

/* ---- QRPolynomial.js ---- */

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );    
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :

            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

/* ---- QR8bitByte.js ---- */

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

/* ---- QRBitBuffer.js ---- */
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

global.SimpleQR = { QRCode: QRCode, QRErrorCorrectLevel: QRErrorCorrectLevel };
})(window);
</script>

<script>
/* ---------- storage helpers (Firebase Realtime Database) ---------- */
// ▼▼▼ 여기에 본인의 Firebase Realtime Database URL을 붙여넣으세요 ▼▼▼
// Firebase 콘솔 > Build > Realtime Database 화면 상단에 나오는 주소예요.
// 예: "https://my-project-default-rtdb.asia-southeast1.firebasedatabase.app"
const FIREBASE_DB_URL = "https://incenter-game-default-rtdb.asia-southeast1.firebasedatabase.app";
// ▲▲▲ 여기까지 ▲▲▲

let lastStorageError = null;
function fbPath(key){ return key.replace(/:$/,'').split(':').filter(Boolean).join('/'); }
function fbConfigured(){
  if(!FIREBASE_DB_URL || FIREBASE_DB_URL.indexOf('YOUR-PROJECT') !== -1){
    lastStorageError = 'FIREBASE_DB_URL이 아직 설정되지 않았어요. 코드 상단의 FIREBASE_DB_URL 값을 본인의 Firebase 주소로 바꿔주세요.';
    return false;
  }
  return true;
}
async function sGet(key, shared){
  if(!fbConfigured()) return null;
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${fbPath(key)}.json`);
    if(!res.ok){ lastStorageError = `조회 실패: HTTP ${res.status} ${res.statusText}`; return null; }
    const data = await res.json();
    lastStorageError = null;
    return (data===null || data===undefined) ? null : data;
  }catch(e){ lastStorageError = (e&&e.message)?e.message:String(e); return null; }
}
async function sSet(key, value, shared){
  if(!fbConfigured()) return null;
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${fbPath(key)}.json`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(value) });
    if(!res.ok){ lastStorageError = `저장 실패: HTTP ${res.status} ${res.statusText}`; return null; }
    lastStorageError = null;
    return true;
  }catch(e){ lastStorageError = (e&&e.message)?e.message:String(e); return null; }
}
async function sDel(key, shared){
  if(!fbConfigured()) return null;
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${fbPath(key)}.json`, { method:'DELETE' });
    if(!res.ok){ lastStorageError = `삭제 실패: HTTP ${res.status} ${res.statusText}`; return null; }
    lastStorageError = null;
    return true;
  }catch(e){ lastStorageError = (e&&e.message)?e.message:String(e); return null; }
}
async function sList(prefix, shared){
  if(!fbConfigured()) return [];
  try{
    const trimmed = prefix.replace(/:$/, '');
    const res = await fetch(`${FIREBASE_DB_URL}/${fbPath(trimmed)}.json`);
    if(!res.ok){ lastStorageError = `목록 조회 실패: HTTP ${res.status} ${res.statusText}`; return []; }
    const data = await res.json();
    lastStorageError = null;
    if(!data) return [];
    return Object.keys(data).map(k => `${trimmed}:${k}`);
  }catch(e){ lastStorageError = (e&&e.message)?e.message:String(e); return []; }
}

/* ---------- utils ---------- */
function randCode(len){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function randId(){ return 'p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function deg2rad(d){ return d*Math.PI/180; }
function dist(p,q){ return Math.hypot(p.x-q.x, p.y-q.y); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderQRCodeSVG(container, text){
  if(!container) return;
  try{
    const qr = new SimpleQR.QRCode(-1, SimpleQR.QRErrorCorrectLevel.M);
    qr.addData(text);
    qr.make();
    const count = qr.getModuleCount();
    const size = 220;
    const cell = size / count;
    let rects = '';
    for(let r=0;r<count;r++){
      for(let c=0;c<count;c++){
        if(qr.isDark(r,c)){
          rects += `<rect x="${(c*cell).toFixed(2)}" y="${(r*cell).toFixed(2)}" width="${(cell+0.6).toFixed(2)}" height="${(cell+0.6).toFixed(2)}" fill="#12181F"/>`;
        }
      }
    }
    container.innerHTML = `<svg viewBox="0 0 ${size} ${size}" width="200" height="200" style="background:#fff;border-radius:10px;">${rects}</svg>`;
  }catch(e){
    container.innerHTML = `<p style="color:#C24C34;font-size:12px;">QR 코드를 만들지 못했어요. 링크가 너무 길 수 있어요.</p>`;
  }
}

/* ---------- triangle / geometry ---------- */
function normAngle(a){ while(a>180)a-=360; while(a<=-180)a+=360; return a; }
function dirAngle(from,to){ return Math.atan2(to.y-from.y, to.x-from.x)*180/Math.PI; }
function ptAtRaw(V,R,angleDeg){ const r=deg2rad(angleDeg); return { x:V.x+R*Math.cos(r), y:V.y+R*Math.sin(r) }; }
function sweepFlag(V,P1,P2){ const cross=(P1.x-V.x)*(P2.y-V.y)-(P1.y-V.y)*(P2.x-V.x); return cross>0?1:0; }
function starPoints(cx,cy,rOuter,rInner,n){
  const pts=[];
  for(let i=0;i<n*2;i++){
    const r = i%2===0 ? rOuter : rInner;
    const a = (Math.PI/n)*i - Math.PI/2;
    pts.push(`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`);
  }
  return pts.join(' ');
}

function randomTriangle(){
  const shapes = [
    [{x:0,y:-95},{x:-85,y:60},{x:85,y:60}],
    [{x:-25,y:-95},{x:-95,y:55},{x:100,y:45}],
    [{x:-110,y:10},{x:95,y:-25},{x:35,y:85}],
    [{x:10,y:-100},{x:-90,y:40},{x:70,y:75}]
  ];
  const base = pick(shapes);
  const rot = Math.random()*360;
  const scale = 1.3 + Math.random()*0.2;
  const cx=210, cy=190;
  const pts = base.map(p=>{
    const j = { x: p.x + (Math.random()*16-8), y: p.y + (Math.random()*16-8) };
    const rad = deg2rad(rot);
    const r = { x: j.x*Math.cos(rad)-j.y*Math.sin(rad), y: j.x*Math.sin(rad)+j.y*Math.cos(rad) };
    return { x: cx + r.x*scale, y: cy + r.y*scale };
  });
  return { A: pts[0], B: pts[1], C: pts[2] };
}
function otherTwo(letter, tri){ const keys=['A','B','C'].filter(k=>k!==letter); return { P: tri[keys[0]], Q: tri[keys[1]] }; }
function incenter(tri){
  const a = dist(tri.B, tri.C), b = dist(tri.A, tri.C), c = dist(tri.A, tri.B);
  const s = a+b+c;
  return { x:(a*tri.A.x+b*tri.B.x+c*tri.C.x)/s, y:(a*tri.A.y+b*tri.B.y+c*tri.C.y)/s };
}
function inradius(tri){
  const a = dist(tri.B, tri.C), b = dist(tri.A, tri.C), c = dist(tri.A, tri.B);
  const s = (a+b+c)/2;
  const area = Math.abs((tri.B.x-tri.A.x)*(tri.C.y-tri.A.y) - (tri.C.x-tri.A.x)*(tri.B.y-tri.A.y))/2;
  return area/s;
}
function pointInTriangle(p, tri){
  const s1 = sweepFlag(tri.A, tri.B, p) ? 1 : -1;
  const s2 = sweepFlag(tri.B, tri.C, p) ? 1 : -1;
  const s3 = sweepFlag(tri.C, tri.A, p) ? 1 : -1;
  return s1===s2 && s2===s3;
}

async function createSession(){
  const code = randCode(5);
  const result = await sSet(`session:${code}`, { createdAt: Date.now(), active:true }, true);
  if(!result){
    state.teacherError = `코드를 저장하지 못했어요. Firebase 설정(FIREBASE_DB_URL)과 Realtime Database 보안 규칙을 확인해주세요.${lastStorageError ? ' [상세: '+lastStorageError+']' : ''}`;
    render();
    return;
  }
  state.teacherError = null;
  state.code = code;
  const base = window.location.origin + window.location.pathname;
  state.joinUrl = `${base}?code=${code}&role=student`;
  render();
}

async function deleteSession(){
  if(!state.code) return;
  const ok = window.confirm(`수업 코드 [${state.code}]의 모든 기록을 삭제할까요? 되돌릴 수 없습니다.`);
  if(!ok) return;
  const keys = await sList(`score:${state.code}:`, true);
  for(const k of keys){ await sDel(k, true); }
  await sDel(`session:${state.code}`, true);
  state.code = null;
  state.joinUrl = null;
  render();
}

async function refreshLeaderboard(){
  if(!state.code) return;
  const keys = await sList(`score:${state.code}:`, true);
  const listEl = document.getElementById('lb-list');
  const countEl = document.getElementById('lb-count');
  if(!listEl) return;
  const entries = [];
  for(const k of keys){
    const v = await sGet(k, true);
    if(v){ entries.push(v); }
  }
  entries.sort((a,b)=> b.score - a.score);
  if(countEl) countEl.textContent = `${entries.length}명 참여`;
  if(entries.length === 0){ listEl.innerHTML = `<li class="lb-empty">아직 참여한 학생이 없어요</li>`; return; }
  listEl.innerHTML = entries.slice(0,30).map((e,i)=>`
    <li class="lb-row"><span class="lb-rank">${i+1}</span><span class="lb-name">${escapeHtml(e.nickname)}</span><span class="lb-score">${e.score}</span></li>
  `).join('');
}

/* ============ GAME ============ */
const ROUND_TIME = 9;
const RAY_COLORS = { 0:'var(--rayA)', 1:'var(--rayB)', 2:'var(--rayC)' };

function startGame(demo){
  state.game = { round:0, totalRounds: demo?1:5, score:0, roundScores:[], demo:!!demo, timerHandle:null };
  nextRound();
}

function nextRound(){
  const g = state.game;
  g.round += 1;
  if(g.round > g.totalRounds){ finishGame(); return; }
  g.tri = randomTriangle();
  g.order = shuffle(['A','B','C']);
  g.stepIndex = 0;
  g.results = {};
  g.phase = 'bisecting';
  g.pointGuess = null;
  g.pointScore = null;
  setView('student-play');
}

function polyPoints(tri){ return `${tri.A.x},${tri.A.y} ${tri.B.x},${tri.B.y} ${tri.C.x},${tri.C.y}`; }

function renderGame(){
  const g = state.game;
  if(g.phase === 'bisecting') return renderBisecting();
  if(g.phase === 'placing-point') return renderPlacing();
  if(g.phase === 'round-result') return renderRoundResult();
}

function gameTop(){

/* ---- phase: bisecting current vertex ---- */
function renderBisecting(){
  const g = state.game;
  const letter = g.order[g.stepIndex];
  const V = g.tri[letter];
  const { P, Q } = otherTwo(letter, g.tri);
  const thetaP = dirAngle(V,P);
  const thetaQRaw = dirAngle(V,Q);
  const delta = normAngle(thetaQRaw - thetaP);
  const minLen = Math.min(dist(V,P), dist(V,Q));
  const Rvis = clamp(minLen*0.55, 40, 92);

  let t0 = 0.5 + (Math.random()<0.5?-1:1)*(0.18+Math.random()*0.22);
  t0 = clamp(t0, 0.06, 0.94);
  g._cur = { letter, V, P, Q, thetaP, delta, Rvis, guessAngle: thetaP + delta*t0, locked:false, timeLeft: ROUND_TIME };

  app.innerHTML = `
    ${gameTop()}
    <div class="panel game-panel">
      <div class="round-bar">
        <span class="round-tag">라운드 ${g.round} / ${g.totalRounds} · ${g.stepIndex+1}/${g.order.length}번째 각</span>
        <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
      </div>
      <div class="svg-wrap">
        <svg id="game-svg" viewBox="0 0 420 380" width="100%" style="max-width:min(90vw, 54vh, 460px);">
          <polygon points="${polyPoints(g.tri)}" fill="#F6F4EE" stroke="#12181F" stroke-width="2"/>
          ${renderLockedLines(g)}
          <path id="wedgeA" fill="rgba(58,111,247,0.18)" d=""></path>
          <path id="wedgeB" fill="rgba(240,101,60,0.18)" d=""></path>
          <line id="side-p" x1="${V.x}" y1="${V.y}" x2="${ptAtRaw(V,Rvis,thetaP).x}" y2="${ptAtRaw(V,Rvis,thetaP).y}" stroke="var(--rayA)" stroke-width="4" stroke-linecap="round"/>
          <line id="side-q" x1="${V.x}" y1="${V.y}" x2="${ptAtRaw(V,Rvis,thetaQRaw).x}" y2="${ptAtRaw(V,Rvis,thetaQRaw).y}" stroke="var(--rayB)" stroke-width="4" stroke-linecap="round"/>
          <line id="guess-line" x1="${V.x}" y1="${V.y}" x2="${V.x}" y2="${V.y}" stroke="#12181F" stroke-width="3" stroke-dasharray="1 6" stroke-linecap="round"/>
          <circle id="handle" cx="${V.x}" cy="${V.y}" r="14" fill="#12181F"/>
          <circle cx="${V.x}" cy="${V.y}" r="5" fill="#12181F"/>
        </svg>
      </div>
      <button class="btn lock-btn" id="lock-btn">이 위치로 고정!</button>
      <p class="hint">가운데 점을 드래그해서 각을 나눠보세요.</p>
    </div>
  `;
  bindGameTop();
  setupDrag();
  updateBisectVisual();
  document.getElementById('lock-btn').addEventListener('click', lockBisect);
  startBisectTimer();
}

function renderLockedLines(g){
  const clipId = 'clip'+g.round+'-'+g.stepIndex;
  const lines = Object.keys(g.results).map(letter=>{
    const r = g.results[letter];
    const far = ptAtRaw(r.V, 320, r.angle);
    const colorIdx = g.order.indexOf(letter);
    const color = RAY_COLORS[colorIdx] || 'var(--ink)';
    return `<line x1="${r.V.x}" y1="${r.V.y}" x2="${far.x}" y2="${far.y}" stroke="${color}" stroke-width="2" stroke-dasharray="5 6" opacity="0.45"/>`;
  }).join('');
  if(!lines) return '';
  return `<defs><clipPath id="${clipId}"><polygon points="${polyPoints(g.tri)}"/></clipPath></defs><g clip-path="url(#${clipId})">${lines}</g>`;
}

function angleFromEvent(evt, svgEl){
  const rect = svgEl.getBoundingClientRect();
  const scaleX = 420/rect.width, scaleY = 380/rect.height;
  const px = (evt.clientX - rect.left) * scaleX;
  const py = (evt.clientY - rect.top) * scaleY;
  return { x:px, y:py };
}

function setupDrag(){
  const svg = document.getElementById('game-svg');
  const g = state.game;
  let dragging = false;
  function onMove(evt){
    if(!dragging || g._cur.locked) return;
    const pt = angleFromEvent(evt, svg);
    const thetaPtr = dirAngle(g._cur.V, pt);
    let d2 = normAngle(thetaPtr - g._cur.thetaP);
    d2 = clamp(d2, Math.min(0,g._cur.delta), Math.max(0,g._cur.delta));
    g._cur.guessAngle = g._cur.thetaP + d2;
    updateBisectVisual();
  }
  function onDown(evt){
    if(g._cur.locked) return;
    dragging = true;
    try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
    onMove(evt);
  }
  function onUp(){ dragging = false; }
  svg.addEventListener('pointerdown', onDown);
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', onUp);
}

function updateBisectVisual(){
  const g = state.game;
  const cur = g._cur;
  const handle = document.getElementById('handle');
  const guessLine = document.getElementById('guess-line');
  const wedgeA = document.getElementById('wedgeA');
  const wedgeB = document.getElementById('wedgeB');
  if(!handle) return;
  const p = ptAtRaw(cur.V, cur.Rvis, cur.guessAngle);
  handle.setAttribute('cx', p.x); handle.setAttribute('cy', p.y);
  guessLine.setAttribute('x2', p.x); guessLine.setAttribute('y2', p.y);

  const pP = ptAtRaw(cur.V, cur.Rvis, cur.thetaP);
  const pQ = ptAtRaw(cur.V, cur.Rvis, cur.thetaP + cur.delta);
  wedgeA.setAttribute('d', `M${cur.V.x},${cur.V.y} L${pP.x},${pP.y} A${cur.Rvis},${cur.Rvis} 0 0 ${sweepFlag(cur.V,pP,p)} ${p.x},${p.y} Z`);
  wedgeB.setAttribute('d', `M${cur.V.x},${cur.V.y} L${pQ.x},${pQ.y} A${cur.Rvis},${cur.Rvis} 0 0 ${sweepFlag(cur.V,pQ,p)} ${p.x},${p.y} Z`);
}

function startBisectTimer(){
  const g = state.game;
  const fill = document.getElementById('timer-fill');
  g.timerHandle = setInterval(()=>{
    g._cur.timeLeft -= 0.1;
    if(fill) fill.style.width = Math.max(0,(g._cur.timeLeft/ROUND_TIME)*100) + '%';
    if(g._cur.timeLeft <= 0){ clearInterval(g.timerHandle); lockBisect(); }
  }, 100);
}

function lockBisect(){
  const g = state.game;
  const cur = g._cur;
  if(cur.locked) return;
  cur.locked = true;
  if(g.timerHandle) clearInterval(g.timerHandle);

  const subP = Math.abs(cur.guessAngle - cur.thetaP);
  const subQ = Math.abs((cur.thetaP+cur.delta) - cur.guessAngle);
  const total = subP+subQ || 1;
  const errorRatio = Math.abs(subP-subQ)/total;
  const accuracy = Math.round(Math.max(0, 100 - errorRatio*150));

  g.results[cur.letter] = { V:cur.V, angle:cur.guessAngle, accuracy };

  const lockBtn = document.getElementById('lock-btn');
  if(lockBtn){ lockBtn.disabled = true; lockBtn.textContent = '고정됨'; }

  setTimeout(()=>{
    g.stepIndex += 1;
    if(g.stepIndex < g.order.length){ render(); }
    else{ g.phase = 'placing-point'; render(); }
  }, 700);
}

/* ---- phase: place the incenter guess ---- */
function renderPlacing(){
  const g = state.game;
  app.innerHTML = `
    ${gameTop()}
    <div class="panel game-panel">
      <div class="round-bar"><span class="round-tag">라운드 ${g.round} / ${g.totalRounds} · 내심 찍기</span></div>
      <div class="svg-wrap">
        <svg id="place-svg" class="svg-click" viewBox="0 0 420 380" width="100%" style="max-width:min(90vw, 54vh, 460px);">
          <polygon points="${polyPoints(g.tri)}" fill="#F6F4EE" stroke="#12181F" stroke-width="2"/>
          ${renderLockedLines(g)}
        </svg>
      </div>
      <p class="place-hint" id="place-err"></p>
      <p class="step-msg">삼각형 안쪽에서, 내심이라고 생각하는 곳을 탭해서 찍어보세요</p>
    </div>
  `;
  bindGameTop();
  const svg = document.getElementById('place-svg');
  svg.addEventListener('pointerdown', (evt)=>{
    const pt = angleFromEvent(evt, svg);
    if(!pointInTriangle(pt, g.tri)){
      document.getElementById('place-err').textContent = '삼각형 안쪽을 눌러주세요';
      return;
    }
    g.pointGuess = pt;
    finishRound();
  });
}

function finishRound(){
  const g = state.game;
  const I = incenter(g.tri);
  const r = inradius(g.tri);
  const d = dist(g.pointGuess, I);
  const pointAccuracy = Math.round(Math.max(0, 100 - (d/Math.max(r,1))*70));
  const accSum = g.order.reduce((s,letter)=> s + g.results[letter].accuracy, 0);
  const avgBisect = Math.round(accSum / g.order.length);
  const roundScore = Math.round(0.5*avgBisect + 0.5*pointAccuracy);

  g.pointScore = pointAccuracy;
  g.avgBisect = avgBisect;
  g.score += roundScore;
  g.roundScores.push(roundScore);
  g.trueIncenter = I;
  g.phase = 'round-result';
  render();
}

/* ---- phase: reveal round result ---- */
function renderRoundResult(){
  const g = state.game;
  const I = g.trueIncenter;
  const guess = g.pointGuess;
  app.innerHTML = `
    ${gameTop()}
    <div class="panel game-panel">
      <div class="round-bar"><span class="round-tag">라운드 ${g.round} / ${g.totalRounds} · 결과</span></div>
      <div class="svg-wrap">
        <svg viewBox="0 0 420 380" width="100%" style="max-width:min(90vw, 54vh, 460px);">
          <polygon points="${polyPoints(g.tri)}" fill="#F6F4EE" stroke="#12181F" stroke-width="2"/>
          ${renderLockedLines(g)}
          <line x1="${guess.x}" y1="${guess.y}" x2="${I.x}" y2="${I.y}" stroke="#B9B2A0" stroke-width="2" stroke-dasharray="3 5"/>
          <circle cx="${I.x}" cy="${I.y}" r="9" fill="var(--match)" opacity="0.35" stroke="#fff" stroke-width="1.6"/>
          <polygon points="${starPoints(guess.x,guess.y,10,4.5,5)}" fill="var(--rayB)" stroke="#fff" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="round-total">${g.roundScores[g.roundScores.length-1]}점</div>
      <p class="hint">★ 주황 별 = 내가 찍은 위치 · 연한 초록 원 = 실제 내심</p>
      <button class="btn btn-primary" id="next-btn" style="margin-top:12px;">${g.round < g.totalRounds ? '다음 라운드' : '결과 보기'}</button>
    </div>
  `;
  bindGameTop();
  document.getElementById('next-btn').addEventListener('click', nextRound);
}

/* ---- finish ---- */
async function finishGame(){
  if(state.game.demo){ setView('demo-done'); return; }
  await saveScore();
  await loadFinalLeaderboard();
  setView('student-done');
}
async function saveScore(){
  const g = state.game;
  const s = state.student;
  const payload = { id: s.id, nickname: s.nickname, score: g.score, ts: Date.now() };
  await sSet(`score:${s.code}:${s.id}`, payload, true);
}
async function loadFinalLeaderboard(){
  const g = state.game;
  const s = state.student;
  const keys = await sList(`score:${s.code}:`, true);
  const entries = [];
  for(const k of keys){
    const v = await sGet(k, true);
    if(v){ entries.push(v); }
  }
  entries.sort((a,b)=> b.score - a.score);
  g.resultEntries = entries;
  const idx = entries.findIndex(e => e.id === s.id);
  g.myRank = idx >= 0 ? idx + 1 : null;
}

function renderDemoDone(){
  const g = state.game;
  app.innerHTML = `
    ${topBar(true)}
    <div class="panel result-panel">
      <div class="label" style="color:var(--muted);font-size:14px;">데모 완료!</div>
      <div class="total">${g.score}</div>
      <div class="rounds">${g.roundScores.map((s,i)=>`<span class="chip">R${i+1} · ${s}점</span>`).join('')}</div>
      <p class="hint" style="margin-top:0;">이 점수는 저장되지 않아요. 학생들이 감을 잡았다면, 이제 진짜 수업 코드를 만들어볼까요?</p>
      <button class="btn btn-primary" data-action="to-teacher">수업 코드 만들러 가기</button>
    </div>
  `;
  bindGlobalNav();
  app.querySelector('[data-action="to-teacher"]').addEventListener('click', ()=>setView('teacher'));
}

function renderResult(){
  const g = state.game;
  const entries = g.resultEntries || [];
  const rankText = g.myRank ? `${g.myRank}위 / 전체 ${entries.length}명 중` : '';
  app.innerHTML = `
    ${topBar(true)}
    <div class="panel result-panel">
      <div class="label" style="color:var(--muted);font-size:14px;">${escapeHtml(state.student.nickname)}님의 최종 점수</div>
      <div class="total">${g.score}</div>
      ${rankText ? `<div style="font-weight:700;color:var(--match);margin-bottom:6px;">${rankText}</div>` : ''}
      <div class="rounds">${g.roundScores.map((s,i)=>`<span class="chip">R${i+1} · ${s}점</span>`).join('')}</div>
      <div class="lb-title" style="margin-top:18px;"><h3>현재까지 순위</h3><span class="count">${entries.length}명 참여</span></div>
      <ul class="lb-list">
        ${entries.length === 0 ? `<li class="lb-empty">아직 기록이 없어요</li>` : entries.slice(0,30).map((e,i)=>`
          <li class="lb-row" style="${e.id===state.student.id ? 'outline:2px solid var(--rayA);' : ''}">
            <span class="lb-rank">${i+1}</span><span class="lb-name">${escapeHtml(e.nickname)}</span><span class="lb-score">${e.score}</span>
          </li>`).join('')}
      </ul>
      <button class="btn btn-primary" data-action="restart" style="margin-top:14px;">다시 시작</button>
      <button class="btn btn-ghost" data-action="go-home" style="margin-top:8px;">처음으로</button>
    </div>
  `;
  bindGlobalNav();
  app.querySelector('[data-action="restart"]').addEventListener('click', ()=>startGame(false));
}

render();
</script>
